# ============================================
# Nginx Site Configuration
# Reverse proxy cho WordPress + phpMyAdmin
# HTTPS self-signed + Security Headers
# ============================================

# ============================================
# 1. HTTP -> HTTPS Redirect
# ============================================
server {
    listen 80;
    server_name blog.local db.blog.local _;

    # Cho phép endpoint /stub_status cho nginx-exporter (Prometheus)
    location /stub_status {
        stub_status on;
        access_log off;
        allow 172.16.0.0/12;    # Chỉ cho phép Docker network
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny all;
    }

    # Còn lại redirect sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================
# 2. HTTPS - WordPress (blog.local)
# ============================================
server {
    listen 443 ssl http2;
    server_name blog.local;

    # ===== SSL =====
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ===== Security Headers (Hardening) =====
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:;" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ===== Logs =====
    access_log /var/log/nginx/wordpress.access.log main;
    error_log  /var/log/nginx/wordpress.error.log warn;

    client_max_body_size 64M;

    root /var/www/html;
    index index.php index.html index.htm;

    # ===== WordPress permalinks =====
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # ===== PHP-FPM =====
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
    }

    # ===== Chặn truy cập file nhạy cảm =====
    location ~ /\.ht {
        deny all;
    }
    location ~ /\.git {
        deny all;
    }
    location = /wp-config.php {
        deny all;
    }
    location ~* /(?:uploads|files)/.*\.php$ {
        deny all;
    }

    # ===== Static files =====
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

# ============================================
# 3. HTTPS - phpMyAdmin (db.blog.local)
# ============================================
server {
    listen 443 ssl http2;
    server_name db.blog.local;

    # ===== SSL =====
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ===== Security Headers =====
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ===== Logs =====
    access_log /var/log/nginx/phpmyadmin.access.log main;
    error_log  /var/log/nginx/phpmyadmin.error.log warn;

    client_max_body_size 64M;

    location / {
        proxy_pass http://phpmyadmin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location ~ /\.ht {
        deny all;
    }
}