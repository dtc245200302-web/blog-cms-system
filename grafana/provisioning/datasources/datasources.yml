# ============================================
# Grafana Datasources Provisioning
# Tự động thêm Prometheus + Loki vào Grafana khi khởi động
# ============================================

apiVersion: 1

datasources:
  # --- Prometheus: metrics ---
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "15s"
      httpMethod: POST

  # --- Loki: logs ---
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000